services:
  logviewer:
    build:
      context: .
    image: readlogs-logviewer:local
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8765}
      CACHE_DIR: ${CACHE_DIR:-/data/log-cache}
    ports:
      - "${LOGVIEWER_PORT:-8765}:8765"
    volumes:
      - logviewer-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  logviewer-data:
