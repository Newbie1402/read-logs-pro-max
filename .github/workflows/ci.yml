name: CI

on:
  push:
    branches:
      - main
      - dev
      - prod
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - dev
      - prod

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose files
        run: |
          APP_ENV_FILE=.env.example docker compose --env-file .env.example config >/dev/null
          IMAGE_REPOSITORY=example.invalid/read-logs IMAGE_TAG=ci \
            docker stack config --compose-file deploy/stack.yml >/dev/null

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: readlogs-logviewer:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
